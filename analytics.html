<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<link rel="icon" type="image/png" href="favicon-64.png">
<link rel="apple-touch-icon" href="apple-touch-icon-180.png">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
  body { padding: 16px 16px 40px; max-width: 600px; margin: 0 auto; }

  body, .stat-card, .list-row, .status-row, .model-row, .stale-row { transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease; }

  /* ── Header ── */
  .an-header { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .back-btn {
    background: var(--sf);
    border: 1px solid var(--line);
    color: var(--tx);
    border-radius: 12px;
    padding: 8px 14px;
    font: 700 12.5px var(--f-head);
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    flex: none;
  }
  .an-header-title { flex: 1; min-width: 0; }
  .an-header-title p { font: 500 11.5px var(--f-mono); color: var(--tx2); margin-top: 2px; }
  .theme-toggle-an { margin-left: auto; flex: none; }

  /* ── Переключатели категории / периода ── */
  .cat-bar { margin-bottom: 10px; }
  .period-bar { display: flex; gap: 7px; margin-bottom: 18px; flex-wrap: wrap; }
  .period-btn {
    flex: 1;
    text-align: center;
    background: var(--sf);
    border: 1px solid var(--line);
    color: var(--tx2);
    border-radius: 999px;
    padding: 8px 4px;
    font: 700 11.5px var(--f-head);
    cursor: pointer;
    white-space: nowrap;
  }
  .period-btn.active { background: var(--ink); color: var(--lime); border-color: var(--ink); }

  /* ── KPI ── */
  .kpi-lime {
    background: var(--lime);
    color: var(--ink);
    border-radius: 24px;
    padding: 18px 20px;
    margin-bottom: 12px;
  }
  .kpi-lime .eyebrow { color: var(--ink); opacity: .6; }
  .kpi-lime .kpi-value { font: 800 34px var(--f-mono); margin-top: 6px; letter-spacing: -.02em; }
  .kpi-lime .kpi-sub { font: 600 12px var(--f-head); opacity: .65; margin-top: 4px; }

  .kpi-row { display: flex; gap: 10px; margin-bottom: 16px; }
  .kpi-row .stat-card .stat-sub { font: 500 11px var(--f-head); color: var(--tx2); margin-top: 2px; }

  /* ── Секции ── */
  .section {
    background: var(--sf);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .section-title { font: 700 12.5px var(--f-head); color: var(--tx); margin-bottom: 14px; }

  /* ── Статусы (прогресс-бары) ── */
  .status-row { display: flex; align-items: center; gap: 10px; }
  .status-row + .status-row { margin-top: 9px; }
  .status-label { font: 600 12px var(--f-head); width: 120px; flex: none; color: var(--tx2); }
  .status-track { flex: 1; height: 8px; border-radius: 999px; background: var(--sf2); overflow: hidden; }
  .status-fill { height: 100%; border-radius: 999px; }
  .status-count { font: 700 12px var(--f-mono); width: 28px; text-align: right; flex: none; color: var(--tx); }

  /* ── Гистограмма по месяцам ── */
  .chart-bars { display: flex; align-items: flex-end; gap: 8px; height: 120px; }
  .chart-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 7px; justify-content: flex-end; height: 100%; cursor: default; }
  .chart-bar { position: relative; width: 100%; border-radius: 6px; min-height: 2px; }
  .chart-m { font: 600 9.5px var(--f-mono); color: var(--tx2); }
  .chart-tooltip {
    position: absolute;
    bottom: calc(100% + 8px);
    left: 50%;
    transform: translateX(-50%) translateY(4px);
    background: var(--ink);
    color: var(--lime);
    font: 700 11px var(--f-mono);
    padding: 5px 9px;
    border-radius: 8px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity .15s ease, transform .15s ease;
    z-index: 10;
  }
  .chart-col:hover .chart-tooltip { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── Топ моделей ── */
  .model-row { display: flex; align-items: center; gap: 11px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .model-row:last-child { border-bottom: none; }
  .model-rank {
    width: 24px; height: 24px;
    border-radius: 8px;
    background: var(--sf2);
    font: 700 11px var(--f-mono);
    color: var(--tx);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .model-rank.gold   { background: color-mix(in srgb, #eab308 22%, var(--sf2)); color: #eab308; }
  .model-rank.silver { background: color-mix(in srgb, #94a3b8 22%, var(--sf2)); color: #94a3b8; }
  .model-rank.bronze { background: color-mix(in srgb, #cd7f32 22%, var(--sf2)); color: #cd7f32; }
  .model-body { flex: 1; min-width: 0; }
  .model-name { font: 700 12.5px var(--f-head); color: var(--tx); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .model-sold { font: 500 10.5px var(--f-head); color: var(--tx2); }
  .model-side { text-align: right; flex: none; }
  .model-profit { font: 700 12.5px var(--f-mono); color: var(--tx); }
  .model-margin { font: 500 10px var(--f-head); color: var(--tx2); margin-top: 2px; }

  /* ── Долго лежащие ── */
  .stale-row { display: flex; align-items: center; gap: 11px; padding: 8px 0; }
  .stale-days { font: 700 11px var(--f-mono); padding: 5px 9px; border-radius: 999px; flex: none; }
  .stale-body { flex: 1; min-width: 0; }
  .stale-name { font: 600 12.5px var(--f-head); color: var(--tx); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stale-sku { font: 500 10.5px var(--f-mono); color: var(--tx2); margin-top: 1px; }
  .stale-price { font: 700 12.5px var(--f-mono); color: var(--tx); white-space: nowrap; flex: none; }

  /* ── Loading / error ── */
  .loading-state { text-align: center; padding: 60px 20px; color: var(--tx2); font: 600 14px var(--f-head); }
  .loading-state .spinner {
    width: 32px; height: 32px;
    border: 3px solid var(--line);
    border-top-color: var(--lime);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 14px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── PIN-доступ к аналитике ── */
  .auth-overlay {
    position: fixed; inset: 0;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    z-index: 5000;
    padding: 20px;
  }
  .auth-card { display: flex; flex-direction: column; gap: 16px; padding-top: 8px; max-width: 320px; width: 100%; }
  .auth-icon {
    width: 52px; height: 52px;
    border-radius: 16px;
    background: var(--sf);
    border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    margin: 0 auto;
  }
  .auth-card h2 { font: 800 22px/1.15 var(--f-head); letter-spacing: -.01em; color: var(--tx); text-align: center; margin-top: 8px; }
  .auth-card .auth-sub { font: 500 12.5px/1.5 var(--f-head); color: var(--tx2); text-align: center; max-width: 250px; margin: 0 auto; }
  .pin-dots { display: flex; gap: 12px; justify-content: center; margin: 6px 0; }
  .pin-dot { width: 15px; height: 15px; border-radius: 50%; border: 2px solid var(--line); background: transparent; transition: background .15s, border-color .15s; }
  .pin-dot.filled { background: var(--lime); border-color: var(--lime); }
  .auth-error { text-align: center; font: 700 12px var(--f-head); color: var(--tx2); min-height: 16px; }
  .auth-error.show { color: var(--st-danger); }
  .pin-keypad { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; max-width: 270px; margin: 0 auto; width: 100%; }
  .pin-key {
    height: 58px;
    border-radius: 20px;
    background: var(--sf);
    border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    font: 600 22px var(--f-mono);
    color: var(--tx);
    cursor: pointer;
  }
  .pin-key.empty { background: transparent; border: none; cursor: default; }
  .pin-key.backspace { font: 700 18px var(--f-head); }

  .dashboard-grid { display: block; }
  .dashboard-main, .dashboard-side { display: flex; flex-direction: column; gap: 14px; }

  /* ── Десктоп ── */
  @media (min-width: 1024px) {
    body { max-width: 1180px; padding: 32px 40px 60px; }

    .an-header { margin-bottom: 26px; }
    .an-header-title .page-title { font-size: 26px; }
    .back-btn { padding: 10px 16px; }

    .filters-row { display: flex; align-items: center; gap: 16px; margin-bottom: 26px; flex-wrap: wrap; }
    .cat-bar { margin-bottom: 0; flex: none; width: auto; }
    .cat-bar .pill-switch-btn { flex: none; padding: 9px 18px; }
    .period-bar { margin-bottom: 0; flex: 1; max-width: 460px; }

    .dashboard-grid { display: grid; grid-template-columns: 1fr 360px; gap: 20px; align-items: start; }

    .kpi-lime { padding: 26px 30px; }
    .kpi-lime .kpi-value { font-size: 44px; }
    .kpi-row .stat-card { padding: 18px 20px; }

    .section { padding: 20px 22px; }
    .chart-bars { height: 160px; }
  }

  /* ── Печатный отчёт (A4, PDF через диалог печати браузера) ──
     Один лист A4, иерархия держится на толщине линеек (3/2/1px) и
     одном чёрном блоке (прибыль) — читается и на ч/б лазернике.
     Цвета заданы напрямую (не через var(--tx) и т.п.) — печать всегда
     чёрным по белому, вне зависимости от темы на экране. */
  #print-report { display: none; }
  @page { size: A4; margin: 0; }
  @media print {
    html, body { background: #fff !important; }
    /* body несёт свой экранный layout (max-width:600px и padding —
       см. правило body{} в начале файла, плюс 1180px на десктопе) —
       без сброса он ограничивал ширину листа даже на честном A4 без
       полей, из-за чего лист выглядел у́же страницы и заголовок
       переносился на две строки. */
    /* body ещё несёт min-height:100vh (общее правило в common.css,
       не только для этой страницы) — та же проблема, что была у
       .report-sheet: vh на печати не всегда равен высоте физической
       страницы, и это тоже могло раздувать body на лишний пустой лист. */
    body { max-width: none !important; padding: 0 !important; margin: 0 !important; min-height: 0 !important; }
    body > *:not(#print-report) { display: none !important; }
    #print-report { display: block !important; background: #fff; }
    /* !important обязателен: у каждого .report-sheet есть инлайновый
       width:794px/min-height:1123px (для пиксель-точного вида на A4
       при 96dpi) — он специфичнее этого правила и без !important
       побеждал бы даже здесь, из-за чего лист не подстраивался под
       реальную печатную область (та зависит от полей, которые
       выставляет диалог печати, а не только от @page).
       min-height не задаём вовсе — vh на печати не всегда равен
       реальной высоте страницы (зависит от браузера/драйвера), из-за
       этого лист "переливался" на лишний пустой второй лист. Разбивку
       на страницы держат только break-after у листа и то, что продажи
       уже нарезаны по строкам на лист (см. REPORT_ROWS_PER_PAGE). */
    #print-report .report-sheet { width: auto !important; min-height: 0 !important; box-shadow: none; break-after: page; }
    #print-report .report-sheet:last-child { break-after: auto; }
    #print-report .report-sheet * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>

<script src="config.js"></script>
<script>
// ── Пароль доступа к аналитике ──────────────────────────────────
// Хранится не открытым текстом, а как SHA-256 хеш. Это не защита
// военного уровня (кто-то может перебрать несложный пароль оффлайн,
// зная хеш из исходного кода страницы), а простой барьер, чтобы
// сотрудники, которые просто пользуются каталогом, не заходили сюда
// случайно. Пока пароль не введён, данные с сервера не запрашиваются.
const ANALYTICS_PASSWORD_HASH = '7de53cf657da848963be4fda0b9010231f6df1bb0088967f50865a61cd152ba6';

async function sha256Hex(text) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

// ── PIN-клавиатура (4 цифры, вводятся тапом) ──────────────────────
let pinDigits = '';

function buildPinKeypad() {
  const keys = ['1','2','3','4','5','6','7','8','9','','0','⌫'];
  const keypad = document.getElementById('pin-keypad');
  keypad.innerHTML = keys.map(k => {
    if (k === '') return '<div class="pin-key empty"></div>';
    if (k === '⌫') return '<div class="pin-key backspace" onclick="pinBackspace()">⌫</div>';
    return '<div class="pin-key" onclick="pinTap(\'' + k + '\')">' + k + '</div>';
  }).join('');
}

function renderPinDots() {
  document.querySelectorAll('#pin-dots .pin-dot').forEach((dot, i) => {
    dot.classList.toggle('filled', i < pinDigits.length);
  });
}

async function pinTap(digit) {
  if (pinDigits.length >= 4) return;
  pinDigits += digit;
  renderPinDots();
  if (pinDigits.length === 4) await submitAnalyticsPassword();
}

function pinBackspace() {
  pinDigits = pinDigits.slice(0, -1);
  renderPinDots();
  document.getElementById('auth-error').classList.remove('show');
  document.getElementById('auth-error').textContent = '';
}

async function submitAnalyticsPassword() {
  const hash = await sha256Hex(pinDigits);
  if (hash === ANALYTICS_PASSWORD_HASH) {
    sessionStorage.setItem('analyticsAuthed', '1');
    document.getElementById('auth-overlay').style.display = 'none';
    init();
  } else {
    const errEl = document.getElementById('auth-error');
    errEl.textContent = 'Неверный код · попробуйте ещё раз';
    errEl.classList.add('show');
    setTimeout(() => {
      pinDigits = '';
      renderPinDots();
      errEl.classList.remove('show');
      errEl.textContent = '';
    }, 700);
  }
}

function checkAnalyticsAuth() {
  buildPinKeypad();
  if (sessionStorage.getItem('analyticsAuthed') === '1') {
    document.getElementById('auth-overlay').style.display = 'none';
    init();
  }
}

let allData    = [];   // все товары (дроны + самокаты)
let currentCat = 'all';
let currentPeriod = 'month';
let lastRenderState = null; // снимок последнего render() — используется для отчёта

// ── Init ──────────────────────────────────────────────────────
async function init() {
  try {
    // Загружаем оба листа параллельно
    const [drones, scooters] = await Promise.all([
      fetchProducts('Дроны'),
      fetchProducts('Самокаты')
    ]);
    allData = [
      ...drones.map(p => ({ ...p, _cat: 'Дроны' })),
      ...scooters.map(p => ({ ...p, _cat: 'Самокаты' }))
    ];

    document.getElementById('loading').style.display   = 'none';
    document.getElementById('dashboard').style.display = 'block';

    const now = new Date();
    document.getElementById('last-update').textContent =
      'Обновлено: ' + now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });

    render();
  } catch (e) {
    document.getElementById('loading').style.display = 'none';
    const err = document.getElementById('error');
    err.style.display = 'block';
    err.textContent = '❌ Ошибка загрузки: ' + e.message;
  }
}

async function fetchProducts(category) {
  const url = apiUrl({ action: 'getAll', category: category });
  const r = await fetch(url);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const data = await r.json();
  if (data.error) throw new Error(data.error);
  return data.products || [];
}

// ── Filters ───────────────────────────────────────────────────
function switchCat(cat, btn) {
  currentCat = cat;
  document.querySelectorAll('.cat-bar .pill-switch-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function setPeriod(period, btn) {
  currentPeriod = period;
  document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function getFilteredData() {
  let data = currentCat === 'all' ? allData : allData.filter(p => p._cat === currentCat);
  return data;
}

function getPeriodStart() {
  const now = new Date();
  if (currentPeriod === 'month')   return new Date(now.getFullYear(), now.getMonth(), 1);
  if (currentPeriod === 'quarter') return new Date(now.getFullYear(), Math.floor(now.getMonth() / 3) * 3, 1);
  if (currentPeriod === 'year')    return new Date(now.getFullYear(), 0, 1);
  return new Date(0); // all time
}

function parseDate(str) {
  if (!str) return null;
  // dd.MM.yyyy
  const m = String(str).match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
  if (m) return new Date(+m[3], +m[2] - 1, +m[1]);
  const d = new Date(str);
  return isNaN(d.getTime()) ? null : d;
}

function fmt(num) {
  if (!num && num !== 0) return '—';
  return Number(num).toLocaleString('ru-RU') + ' ₽';
}

// ── Main render ───────────────────────────────────────────────
function render() {
  const data      = getFilteredData();
  const periodStart = getPeriodStart();

  // Товары проданные за период
  const soldInPeriod = data.filter(p => {
    if (p['Статус'] !== 'Продан') return false;
    const d = parseDate(p['Дата продажи']);
    return d && d >= periodStart;
  });

  // Товары в наличии (склад)
  const inStock = data.filter(p => p['Статус'] !== 'Продан');

  // Прибыль за период
  const totalProfit = soldInPeriod.reduce((s, p) => s + (parseFloat(p['Прибыль']) || 0), 0);

  // Стоимость склада (сумма закупочных цен товаров не-продан)
  const stockValue = inStock.reduce((s, p) => s + (parseFloat(p['Цена закупка']) || 0), 0);

  // Среднее время продажи (дни)
  const times = data
    .filter(p => p['Статус'] === 'Продан' && parseDate(p['Дата закупки']) && parseDate(p['Дата продажи']))
    .map(p => {
      const buy  = parseDate(p['Дата закупки']);
      const sell = parseDate(p['Дата продажи']);
      return Math.round((sell - buy) / 86400000);
    })
    .filter(d => d >= 0);
  const avgDays = times.length ? Math.round(times.reduce((a, b) => a + b, 0) / times.length) : null;

  // ── KPI ──
  document.getElementById('kpi-profit').textContent     = fmt(totalProfit);
  document.getElementById('kpi-profit-sub').textContent = soldInPeriod.length + ' продаж за период';
  document.getElementById('kpi-stock').textContent      = fmt(stockValue);
  document.getElementById('kpi-stock-sub').textContent  = inStock.length + ' товаров';
  document.getElementById('kpi-sold').textContent       = soldInPeriod.length + ' шт';
  document.getElementById('kpi-sold-sub').textContent   = 'выручка: ' + fmt(soldInPeriod.reduce((s,p) => s + (parseFloat(p['Цена продажа']) || 0), 0));
  document.getElementById('kpi-avgdays').textContent    = avgDays !== null ? avgDays : '—';

  // ── Статусы (прогресс-бары, цвета — из общего status.js) ──
  const counts = {};
  data.forEach(p => {
    const s = p['Статус'] || 'Не продан';
    counts[s] = (counts[s] || 0) + 1;
  });
  const maxCount = Math.max(1, ...Object.values(counts));

  const sg = document.getElementById('status-grid');
  sg.innerHTML = Object.entries(counts).map(([status, count]) => {
    const style = STATUS_ANALYTICS_COLORS[status] || { color: 'var(--tx2)', bg: 'var(--sf2)' };
    const widthPct = Math.round((count / maxCount) * 100);
    return `<div class="status-row">
      <div class="status-label">${getStatusText(status)}</div>
      <div class="status-track"><div class="status-fill" style="width:${widthPct}%; background:${style.color}"></div></div>
      <div class="status-count">${count}</div>
    </div>`;
  }).join('');

  // ── Динамика продаж ──
  renderChart(data);

  // ── Топ моделей ──
  const modelStats = {};
  data.filter(p => p['Статус'] === 'Продан').forEach(p => {
    const name = getModelGroupKey(p['Название'] || 'Без названия');
    if (!modelStats[name]) modelStats[name] = { profit: 0, sold: 0, revenue: 0, cost: 0 };
    modelStats[name].profit  += parseFloat(p['Прибыль'])     || 0;
    modelStats[name].revenue += parseFloat(p['Цена продажа']) || 0;
    modelStats[name].cost    += parseFloat(p['Цена закупка']) || 0;
    modelStats[name].sold++;
  });

  const topModels = Object.entries(modelStats)
    .sort((a, b) => b[1].profit - a[1].profit)
    .slice(0, 7);

  const rankClass = (i) => i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : '';

  document.getElementById('top-models').innerHTML = topModels.length
    ? topModels.map(([name, s], i) => {
        const margin = s.revenue > 0 ? Math.round((s.profit / s.revenue) * 100) : 0;
        return `<div class="model-row">
          <div class="model-rank ${rankClass(i)}">${i + 1}</div>
          <div class="model-body">
            <div class="model-name">${name}</div>
            <div class="model-sold">${s.sold} продаж</div>
          </div>
          <div class="model-side">
            <div class="model-profit">${fmt(Math.round(s.profit))}</div>
            <div class="model-margin">маржа ${margin}%</div>
          </div>
        </div>`;
      }).join('')
    : '<div style="color:var(--tx2);font-size:13px;text-align:center;padding:20px">Нет данных о продажах</div>';

  // ── Долго лежащие ──
  const today = new Date();
  const stale = data
    .filter(p => p['Статус'] !== 'Продан' && parseDate(p['Дата закупки']))
    .map(p => {
      const buy  = parseDate(p['Дата закупки']);
      const days = Math.round((today - buy) / 86400000);
      return { ...p, _days: days };
    })
    .sort((a, b) => b._days - a._days)
    .slice(0, 5);

  const dayColor = (d) => d > 60 ? 'var(--st-danger)' : d > 30 ? 'var(--st-warn)' : 'var(--st-ok)';

  document.getElementById('stale-items').innerHTML = stale.length
    ? stale.map(p => `<div class="stale-row">
        <div class="stale-days" style="background:color-mix(in srgb, ${dayColor(p._days)} 16%, transparent); color:${dayColor(p._days)}">${p._days} дн</div>
        <div class="stale-body">
          <div class="stale-name">${p['Название'] || '—'}</div>
          <div class="stale-sku">${p['Артикул'] || ''}</div>
        </div>
        <div class="stale-price">${fmt(p['Цена закупка'])}</div>
      </div>`).join('')
    : '<div style="color:var(--tx2);font-size:13px;text-align:center;padding:20px">Нет товаров на складе</div>';

  lastRenderState = { soldInPeriod, inStock, totalProfit, stockValue, avgDays, counts, topModels };
}

// ── Отчёт за период (A4, печать / сохранение в PDF через диалог печати) ──
// Разметка — по дизайн-хэндоффу: один лист A4, иерархия на толщине
// линеек и одном чёрном блоке (прибыль), без заливок, которые на ч/б
// принтере превратятся в серую кашу.
function escapeHtmlRp(text) {
  const div = document.createElement('div');
  div.textContent = text == null ? '' : String(text);
  return div.innerHTML;
}

const RU_MONTHS_NOM = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];

function periodLabel() {
  const now = new Date();
  if (currentPeriod === 'month')   return RU_MONTHS_NOM[now.getMonth()] + ' ' + now.getFullYear();
  if (currentPeriod === 'quarter') return (Math.floor(now.getMonth() / 3) + 1) + '-й квартал ' + now.getFullYear();
  if (currentPeriod === 'year')    return now.getFullYear() + ' год';
  return 'всё время';
}

function categoryLabel() {
  return currentCat === 'all' ? 'все категории' : currentCat.toLowerCase();
}

// Числа отчёта — единый формат "12 345 ₽" (Intl.NumberFormat + один
// раз символ рубля через неразрывный пробел, без дублирования "₽₽").
function fmtRp(n) {
  return new Intl.NumberFormat('ru-RU').format(Math.round(n || 0)) + ' ₽';
}

function fmtDateShort(str) {
  const m = String(str || '').match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
  return m ? (m[1] + '.' + m[2] + '.' + m[3].slice(2)) : (str || '');
}

function fmtDateTime(d) {
  const p2 = (n) => String(n).padStart(2, '0');
  return p2(d.getDate()) + '.' + p2(d.getMonth() + 1) + '.' + d.getFullYear() + ' · ' + p2(d.getHours()) + ':' + p2(d.getMinutes());
}

function pluralPositionsRp(n) {
  const n100 = n % 100, n10 = n % 10;
  if (n100 >= 11 && n100 <= 19) return 'позиций';
  if (n10 === 1) return 'позиция';
  if (n10 >= 2 && n10 <= 4) return 'позиции';
  return 'позиций';
}

    + '<div style="font:600 21px \'IBM Plex Mono\',monospace;color:' + (dark ? '#fff' : '#101215') + '">' + value + '</div>'

    + '<div style="display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:#101215;border:1px solid #101215;border-radius:8px;overflow:hidden">'
    + reportMetricCell('ПРИБЫЛЬ', fmtRp(data.metrics.profit), true)
    + reportMetricCell('ВЫРУЧКА', fmtRp(data.metrics.revenue), false)
    + reportMetricCell('ПРОДАНО', data.metrics.soldCount + ' шт', false)
    + '</div></div>';
}

// Настоящая <table> вместо CSS grid: у браузеров десятилетиями зрелая,
// надёжная поддержка разбивки строк таблицы между страницами при
// печати (thead автоматически повторяется, tr с break-inside:avoid
// не разрезается) — у CSS grid с этим по печати давние проблемы в
// части браузеров (контент может "уехать" не на ту страницу).
function reportTableHeaders() {
  const base = 'font:700 8.5px \'Plus Jakarta Sans\',sans-serif;letter-spacing:.11em;color:#101215;padding:0 0 8px;border-bottom:2px solid #101215;';
  return '<tr>'
    + '<th style="' + base + 'text-align:left;">АРТИКУЛ</th>'
    + '<th style="' + base + 'text-align:left;">НАЗВАНИЕ</th>'
    + '<th style="' + base + 'text-align:left;">ДАТА</th>'
    + '<th style="' + base + 'text-align:right;">ЗАКУПКА</th>'
    + '<th style="' + base + 'text-align:right;">ПРОДАЖА</th>'
    + '<th style="' + base + 'text-align:right;">ПРИБЫЛЬ</th>'
    + '</tr>';
}

function reportRow(sale, zebra) {
  const bg = zebra ? '#f2f2f0' : 'transparent';
  const top = 'border-top:1px solid rgba(16,18,21,.28);background:' + bg + ';';
  return '<tr style="break-inside:avoid;">'
    + '<td style="font:600 11.5px \'IBM Plex Mono\',monospace;color:#101215;padding:11px 8px 11px 0;' + top + '">' + escapeHtmlRp(sale.sku) + '</td>'
    + '<td style="font:600 12.5px \'Plus Jakarta Sans\',sans-serif;color:#101215;padding:11px 8px 11px 0;' + top + '">' + escapeHtmlRp(sale.name) + '</td>'
    + '<td style="font:400 11.5px \'IBM Plex Mono\',monospace;color:#101215;padding:11px 8px 11px 0;' + top + '">' + escapeHtmlRp(sale.date) + '</td>'
    + '<td style="font:400 11.5px \'IBM Plex Mono\',monospace;color:#101215;padding:11px 0;' + top + 'text-align:right">' + fmtRp(sale.buy) + '</td>'
    + '<td style="font:400 11.5px \'IBM Plex Mono\',monospace;color:#101215;padding:11px 0;' + top + 'text-align:right">' + fmtRp(sale.sell) + '</td>'
    + '<td style="font:700 11.5px \'IBM Plex Mono\',monospace;color:#101215;padding:11px 0;' + top + 'text-align:right">' + fmtRp(sale.profit) + '</td>'
    + '</tr>';
}

function reportTotalsRow(totals) {
  return '<tr>'
    + '<td colspan="4" style="font:700 11px \'Plus Jakarta Sans\',sans-serif;letter-spacing:.08em;color:#101215;padding:11px 0;border-top:2px solid #101215">ИТОГО</td>'
    + '<td style="font:600 12px \'IBM Plex Mono\',monospace;color:#101215;padding:11px 0;border-top:2px solid #101215;text-align:right">' + fmtRp(totals.sell) + '</td>'
    + '<td style="font:700 12px \'IBM Plex Mono\',monospace;color:#101215;padding:11px 0;border-top:2px solid #101215;text-align:right">' + fmtRp(totals.profit) + '</td>'
    + '</tr>';
}

function reportTableSectionHtml(salesChunk, opts) {
  let bodyHtml;
  if (opts.isEmpty) {
    bodyHtml = '<tr><td colspan="6" style="padding:24px 0;text-align:center;font:500 12px \'Plus Jakarta Sans\',sans-serif;color:rgba(16,18,21,.55)">За выбранный период продаж не было</td></tr>';
  } else {
    bodyHtml = salesChunk.map((s, i) => reportRow(s, i % 2 === 0)).join('');
    if (opts.showTotals) bodyHtml += reportTotalsRow(opts.totals);
  }
  return '<div style="padding:32px 46px 0;display:flex;flex-direction:column;gap:12px;flex:1">'
    + '<div style="display:flex;align-items:baseline;justify-content:space-between">'
    + '<div style="font:700 15px \'Plus Jakarta Sans\',sans-serif;color:#101215">Продажи за период</div>'
    + '<div style="font:600 11px \'IBM Plex Mono\',monospace;color:#101215">' + opts.totalCount + ' ' + pluralPositionsRp(opts.totalCount) + '</div>'
    + '</div>'
    + '<table style="width:100%;border-collapse:collapse;table-layout:fixed;">'
    + '<colgroup><col style="width:88px"><col><col style="width:84px"><col style="width:92px"><col style="width:92px"><col style="width:96px"></colgroup>'
    + '<thead>' + reportTableHeaders() + '</thead>'
    + '<tbody>' + bodyHtml + '</tbody>'
    + '</table>'
    + '</div>';
}

function reportFooterHtml(pageNum, totalPages) {
  return '<div style="padding:16px 46px 22px;display:flex;align-items:center;justify-content:space-between;border-top:2px solid #101215;margin-top:26px">'
    + '<div style="font:500 9.5px \'IBM Plex Mono\',monospace;color:#101215">Лаба · инвентаризация · сформировано автоматически</div>'
    + '<div style="font:500 9.5px \'IBM Plex Mono\',monospace;color:#101215">' + pageNum + ' / ' + totalPages + '</div>'
    + '</div>';
}

// Консервативная оценка: 26 строк, которые советовал хэндофф, реально
// умещаются только при однострочных названиях — с расчётом на то, что
// первая страница ещё несёт блок метрик (меньше места), взяли с запасом.
const REPORT_ROWS_PER_PAGE = 18;

function renderReport(data) {
  const sales = data.sales || [];
  const isEmpty = sales.length === 0;
  const chunks = [];
  if (isEmpty) {
    chunks.push([]);
  } else {
    for (let i = 0; i < sales.length; i += REPORT_ROWS_PER_PAGE) chunks.push(sales.slice(i, i + REPORT_ROWS_PER_PAGE));
  }
  const totalPages = chunks.length;

  return chunks.map((chunk, pageIndex) => {
    const isFirstPage = pageIndex === 0;
    const isLastPage  = pageIndex === totalPages - 1;
    return '<div class="report-sheet" style="width:794px;min-height:1123px;box-sizing:border-box;background:#fff;display:flex;flex-direction:column;">'
      + reportHeaderHtml(data)
      + (isFirstPage ? reportMetricsHtml(data) : '')
      + reportTableSectionHtml(chunk, {
          totalCount: sales.length,
          showTotals: isLastPage && !isEmpty,
          totals: data.totals,
          isEmpty: isEmpty
        })
      + reportFooterHtml(pageIndex + 1, totalPages)
      + '</div>';
  }).join('');
}

function downloadMonthlyReport() {
  if (!lastRenderState) return;
  const { soldInPeriod, totalProfit } = lastRenderState;
  const revenue = soldInPeriod.reduce((s, p) => s + (parseFloat(p['Цена продажа']) || 0), 0);

  const sales = soldInPeriod.slice()
    .sort((a, b) => (parseDate(a['Дата продажи']) || 0) - (parseDate(b['Дата продажи']) || 0))
    .map(p => ({
      sku:    p['Артикул'] || '',
      name:   p['Название'] || '',
      date:   fmtDateShort(p['Дата продажи']),
      buy:    parseFloat(p['Цена закупка']) || 0,
      sell:   parseFloat(p['Цена продажа']) || 0,
      profit: parseFloat(p['Прибыль']) || 0
    }));

  const data = {
    period:      periodLabel(),
    category:    categoryLabel(),
    generatedAt: fmtDateTime(new Date()),
    metrics:     { profit: totalProfit, revenue: revenue, soldCount: soldInPeriod.length },
    sales:       sales,
    totals:      { sell: revenue, profit: totalProfit }
  };

  document.getElementById('print-report').innerHTML = renderReport(data);
  window.print();
}

// ── Выгрузка всей таблицы товаров в Excel (только для просмотра — правки
// в файле никак не влияют на реальные данные, это просто снимок на момент
// скачивания) ──
function downloadDataExport() {
  if (!allData.length) return;
  if (typeof XLSX === 'undefined') {
    alert('Не удалось загрузить модуль Excel (xlsx.full.min.js). Обнови страницу (⌘⇧R) и попробуй ещё раз.');
    return;
  }

  const headers = [
    'Категория', 'Артикул', 'Название', 'Серийный номер', 'Статус',
    'Цена закупки', 'Дата закупки', 'Цена продажа', 'Дата продажи', 'Прибыль',
    'Затраты ремонт', 'Затраты доставка', 'Ссылка на Авито', 'Состояние / описание'
  ];

  const toNum = (v) => {
    const n = parseFloat(v);
    return (v !== undefined && v !== null && v !== '' && !isNaN(n)) ? n : '';
  };

  const rows = allData.map(p => [
    p._cat || '',
    p['Артикул'] || '',
    p['Название'] || '',
    p['Серийный номер'] || '',
    getStatusText(p['Статус']),
    toNum(p['Цена закупка']),
    p['Дата закупки'] || '',
    toNum(p['Цена продажа']),
    p['Дата продажи'] || '',
    toNum(p['Прибыль']),
    toNum(p['Затраты ремонт']),
    toNum(p['Затраты доставка']),
    p['Ссылка на Авито'] || '',
    p['Состояние'] || ''
  ]);

  const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
  ws['!cols'] = [
    { wch: 10 }, { wch: 10 }, { wch: 28 }, { wch: 16 }, { wch: 14 },
    { wch: 12 }, { wch: 12 }, { wch: 12 }, { wch: 12 }, { wch: 12 },
    { wch: 12 }, { wch: 12 }, { wch: 24 }, { wch: 34 }
  ];

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Товары');
  const stamp = new Date().toISOString().slice(0, 10);
  XLSX.writeFile(wb, 'laba-tovary-' + stamp + '.xlsx');
}

// ── Гистограмма прибыли по месяцам (CSS-бары, без внешних библиотек) ──
function renderChart(data) {
  const months = {};
  for (let i = 7; i >= 0; i--) {
    const d = new Date();
    d.setDate(1);
    d.setMonth(d.getMonth() - i);
    const key = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    months[key] = 0;
  }

  data.filter(p => p['Статус'] === 'Продан').forEach(p => {
    const d = parseDate(p['Дата продажи']);
    if (!d) return;
    const key = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    if (key in months) months[key] += parseFloat(p['Прибыль']) || 0;
  });

  const entries = Object.entries(months).map(([k, v]) => {
    const [y, m] = k.split('-');
    const label = new Date(+y, +m - 1, 1).toLocaleString('ru-RU', { month: 'short' }).replace('.', '');
    return { label, value: Math.round(v) };
  });

  const maxAbs = Math.max(1, ...entries.map(e => Math.abs(e.value)));

  document.getElementById('sales-chart').innerHTML = entries.map(e => {
    const heightPct = Math.max(3, Math.round((Math.abs(e.value) / maxAbs) * 100));
    const color = e.value >= 0 ? 'var(--lime)' : 'var(--st-danger)';
    const sum = e.value.toLocaleString('ru-RU') + ' ₽';
    return `<div class="chart-col" title="${sum}">
      <div class="chart-bar" style="height:${heightPct}%; background:${color}">
        <span class="chart-tooltip">${sum}</span>
      </div>
      <div class="chart-m">${e.label}</div>
    </div>`;
  }).join('');
}

checkAnalyticsAuth();

// ── Тема (общая логика в theme.js) ──────────────────
initTheme();
</script>
